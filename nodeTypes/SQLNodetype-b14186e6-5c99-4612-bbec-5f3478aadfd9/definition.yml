fileVersion: 1
id: b14186e6-5c99-4612-bbec-5f3478aadfd9
isDisabled: false
metadata:
  defaultStorageLocation: null
  error: null
  nodeMetadataSpec: |-
    capitalized: SQL Stage
    short: SSQL
    plural: SQL Stages
    tagColor: '#1890FF'
    inputMode: 'sql'

    metadata:
      deployStrategy: advanced
      nodeMetadataSpec: |
        capitalized: SQL Transform
        short: SQLT
        plural: SQL Transforms
        tagColor: "#4A90E2"
        materializationOptions:
          table:
            displayName: Table
          view:
            displayName: View
          transient_table:
            displayName: Transient Table
          incremental:
            displayName: Incremental
        isMultisourceToggleEnabled: true
        isOverrideSQLEnabled: true
        isColumnResyncEnabled: true
        fetchDataOnSuccess: true
        systemColumns:
          - name: "_LOADED_AT"
            dataType: "TIMESTAMP_NTZ"
            description: "Timestamp when the record was loaded"
            default: "CURRENT_TIMESTAMP()"
          - name: "_UPDATED_AT"
            dataType: "TIMESTAMP_NTZ"
            description: "Timestamp when the record was last updated"
            default: "CURRENT_TIMESTAMP()"
    config:
    - groupName: Options
      items:
      - type: materializationSelector
        default: table
        options:
          - table
          - view
        isRequired: true

      - type: multisourceToggle
        enableIf: "{% if config.materializationType == 'table' %} true {% else %} false {% endif %}"

      - type: overrideSQLToggle
        enableIf: "{% if config.materializationType == 'view' %} true {% else %} false {% endif %}"

      - displayName: Multi Source Strategy
        attributeName: insertStrategy
        type: dropdownSelector
        default: INSERT
        options:
          - INSERT
          - UNION
          - UNION ALL
        enableIf: "{% if node.isMultisource %} true {% else %} false {% endif %}"

      - displayName: Truncate Before
        attributeName: truncateBefore
        type: toggleButton
        default: true

      - displayName: Enable Tests
        attributeName: testsEnabled
        type: toggleButton
        default: true

      - displayName: Pre-SQL
        attributeName: preSQL
        type: textBox
        syntax: sql
        isRequired: false

      - displayName: Post-SQL
        attributeName: postSQL
        type: textBox
        syntax: sql
        isRequired: false
name: SQL Node type
type: NodeType
